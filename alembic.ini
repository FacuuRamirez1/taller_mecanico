# Configuración de Alembic — SIN credenciales.
# La URL de conexión NO se declara acá: migrations/env.py la toma de
# Settings.DATABASE_URL (app/core/config.py, se crea en C-01).
# Regla dura: ningún secreto con valor por defecto en archivos versionados.

[alembic]
# Ruta a los scripts de migración, relativa a este archivo.
script_location = %(here)s/migrations

# Ruta a la raíz del proyecto para que `app` sea importable desde env.py.
prepend_sys_path = .

# Separador de rutas multiplataforma (posix | os | legacy).
path_separator = os

# Formato de los nombres de archivo de revisión.
file_template = %%(rev)s_%%(slug)s

# Marca de tiempo usada por file_template.
timezone = America/Argentina/Buenos_Aires

[post_write_hooks]
# Hooks de post-escritura (ninguno habilitado).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
